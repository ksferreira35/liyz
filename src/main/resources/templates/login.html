<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Liyz Todo</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="liyz-body">

<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand-lockup text-center">
            <div class="brand-mark">L</div>
            <h1>Liyz Todo</h1>
            <p>Sign in to organize your tasks</p>
        </div>

        <div
                class="liyz-alert liyz-alert-danger"
                role="alert"
                th:if="${param.error}">
            Invalid username or password.
        </div>

        <div
                class="liyz-alert liyz-alert-success"
                role="alert"
                th:if="${param.logout}">
            You have been signed out.
        </div>

        <div
                class="liyz-alert liyz-alert-success"
                role="alert"
                th:if="${param.registered}">
            Account created successfully.
        </div>

        <form class="liyz-card auth-card" th:action="@{/login}" method="post">
            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

            <div class="liyz-field">
                <label for="username">Username</label>

                <input
                        id="username"
                        name="username"
                        type="text"
                        class="form-control liyz-input"
                        placeholder="Enter your username"
                        required
                        autofocus
                        autocomplete="username">
            </div>

            <div class="liyz-field">
                <label for="password">Password</label>

                <input
                        id="password"
                        name="password"
                        type="password"
                        class="form-control liyz-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password">
            </div>

            <button type="submit" class="liyz-button liyz-button-primary w-100">
                Sign in
            </button>

            <p class="auth-switch">
                Don't have an account?
                <a th:href="@{/register}">Create account</a>
            </p>
        </form>
    </section>
</main>

</body>
</html>
