spring.application.name=todo-list

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:todo-list}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
app.chat.memory.redis-ttl-days=${CHAT_MEMORY_REDIS_TTL_DAYS:7}

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-20b}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.task.execution.pool.core-size=2

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

resend.api-key=${RESEND_API_KEY}
resend.from-email=no-reply@ksferreira.org

app.notifications.scheduler-fixed-delay-ms=${NOTIFICATION_SCHEDULER_FIXED_DELAY_MS:60000}
app.notifications.batch-size=${NOTIFICATION_BATCH_SIZE:100}
app.notifications.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
app.notifications.rabbit.exchange=${NOTIFICATION_RABBIT_EXCHANGE:task.notifications.exchange}
app.notifications.rabbit.queue=${NOTIFICATION_RABBIT_QUEUE:task.notifications.queue}
app.notifications.rabbit.routing-key=${NOTIFICATION_RABBIT_ROUTING_KEY:task.notifications.due}
