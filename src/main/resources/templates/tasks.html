<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>My Tasks | Liyz Todo</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script
            src="https://unpkg.com/htmx.org@2.0.8"
            defer>
    </script>
    <script>
        document.addEventListener('htmx:configRequest', function (event) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            event.detail.headers[header] = token;
        });

        document.addEventListener('htmx:afterRequest', function (event) {
            const retarget = event.detail.xhr.getResponseHeader('HX-Retarget');

            if (event.detail.successful && event.detail.elt.id === 'task-create-form' && !retarget) {
                document.querySelector('.task-empty-state')?.remove();
                document.querySelector('#task-form-errors').innerHTML = '';
                event.detail.elt.reset();
                document.dispatchEvent(new CustomEvent('liyz:refresh-tasks'));
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const chatForm = document.querySelector('#liyz-chat-form');
            const chatInput = document.querySelector('#liyz-chat-input');
            const chatMessages = document.querySelector('#liyz-chat-messages');
            const robotIcon = document.querySelector('.robot-icon');

            if (robotIcon) {
                const expressions = ['is-happy', 'is-focused', 'is-curious'];
                let expressionIndex = 0;

                robotIcon.addEventListener('mouseenter', function () {
                    robotIcon.classList.remove(...expressions);
                    robotIcon.classList.add(expressions[expressionIndex]);
                    expressionIndex = (expressionIndex + 1) % expressions.length;
                });

                robotIcon.addEventListener('mouseleave', function () {
                    robotIcon.classList.remove(...expressions);
                });
            }

            if (!chatForm || !chatInput || !chatMessages) {
                return;
            }

            const refreshTaskList = async function () {
                const taskListSection = document.querySelector('#task-list-section');
                if (!taskListSection) {
                    return;
                }

                const sortDirection = taskListSection.dataset.sortDirection || 'desc';
                const response = await fetch(`/tasks/fragments/list?sortDirection=${sortDirection}`);
                if (!response.ok) {
                    return;
                }

                taskListSection.outerHTML = await response.text();
            };

            document.addEventListener('liyz:refresh-tasks', refreshTaskList);

            const escapeHtml = function (value) {
                return value
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#039;');
            };

            const renderInlineMarkdown = function (value) {
                return value
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
            };

            const renderMarkdown = function (value) {
                const lines = escapeHtml(value).split(/\r?\n/);
                const html = [];
                let listOpen = false;

                const closeList = function () {
                    if (listOpen) {
                        html.push('</ul>');
                        listOpen = false;
                    }
                };

                lines.forEach(function (line) {
                    const trimmed = line.trim();

                    if (!trimmed) {
                        closeList();
                        return;
                    }

                    const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
                    if (heading) {
                        closeList();
                        const level = Math.min(heading[1].length, 4);
                        html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
                        return;
                    }

                    const listItem = trimmed.match(/^[-*]\s+(.+)$/);
                    if (listItem) {
                        if (!listOpen) {
                            html.push('<ul>');
                            listOpen = true;
                        }
                        html.push(`<li>${renderInlineMarkdown(listItem[1])}</li>`);
                        return;
                    }

                    closeList();
                    html.push(`<p>${renderInlineMarkdown(trimmed)}</p>`);
                });

                closeList();
                return html.join('');
            };

            const appendMessage = function (author, text, alignEnd) {
                const wrapper = document.createElement('div');
                wrapper.className = alignEnd ? 'chat-message chat-message-user' : 'chat-message';

                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerHTML = renderMarkdown(text);

                const meta = document.createElement('span');
                meta.className = 'chat-meta';
                meta.textContent = author;

                wrapper.appendChild(bubble);
                wrapper.appendChild(meta);
                chatMessages.appendChild(wrapper);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            chatForm.addEventListener('submit', async function (event) {
                event.preventDefault();

                const message = chatInput.value.trim();
                if (!message) {
                    return;
                }

                appendMessage('You', message, true);
                chatInput.value = '';

                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                const storedConversationId = localStorage.getItem('liyzConversationId');
                const conversationId = storedConversationId === 'null' ? null : storedConversationId;

                try {
                    const response = await fetch('/ai/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            [header]: token
                        },
                        body: JSON.stringify({conversationId, message})
                    });

                    if (!response.ok) {
                        throw new Error('AI request failed');
                    }

                    const data = await response.json();
                    if (data.conversationId) {
                        localStorage.setItem('liyzConversationId', data.conversationId);
                    }
                    appendMessage('Liyz', data.response, false);
                    await refreshTaskList();
                } catch (error) {
                    appendMessage('Liyz', 'I could not process that request right now. Please try again.', false);
                }
            });
        });
    </script>
</head>

<body class="liyz-body">

<div class="app-shell">
    <aside class="app-sidebar">
        <div>
            <a class="app-brand" th:href="@{/tasks}">
                <span>Liyz Todo</span>
                <small>AI task manager</small>
            </a>

            <nav class="app-nav" aria-label="Main navigation">
                <a class="app-nav-item active" th:href="@{/tasks}">
                    <span class="nav-icon">T</span>
                    My Tasks
                </a>

                <span class="app-nav-item disabled">
                    <span class="nav-icon">C</span>
                    Calendar
                    <small>Coming soon</small>
                </span>

                <span class="app-nav-item disabled">
                    <span class="nav-icon">!</span>
                    Notifications
                    <small>Coming soon</small>
                </span>
            </nav>
        </div>

        <form th:action="@{/logout}" method="post">
            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

            <button type="submit" class="logout-button">
                <span class="logout-icon" aria-hidden="true">-&gt;</span>
                Logout
            </button>
        </form>
    </aside>

    <main class="task-workspace">
        <header class="mobile-header">
            <a class="mobile-brand" th:href="@{/tasks}">
                <span class="brand-mark">L</span>
                Liyz Todo
            </a>

            <form th:action="@{/logout}" method="post">
                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <button type="submit" class="icon-button" aria-label="Logout">
                    -&gt;
                </button>
            </form>
        </header>

        <section class="tasks-main">
            <div class="page-heading">
                <h1>My tasks</h1>
                <p>Organize your flow and let Liyz handle the details.</p>
            </div>

            <section class="liyz-card task-create-card">
                <h2>Create new task</h2>

                <form
                        id="task-create-form"
                        th:object="${taskRequest}"
                        th:action="@{/tasks}"
                        method="post"
                        hx-post="/tasks"
                        hx-target="#task-list"
                        hx-swap="afterbegin">
                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                    <div
                            id="task-form-errors"
                            class="task-form-errors">
                    </div>

                    <div class="liyz-field">
                        <label for="title">Task title</label>

                        <input
                                id="title"
                                type="text"
                                th:field="*{title}"
                                class="form-control liyz-input"
                                placeholder="e.g., Weekly sync meeting">
                    </div>

                    <div class="liyz-field">
                        <label for="description">Description</label>

                        <textarea
                                id="description"
                                th:field="*{description}"
                                class="form-control liyz-input"
                                rows="4"
                                placeholder="Add context or specific subtasks..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="liyz-button liyz-button-primary">
                            Create task
                        </button>
                    </div>
                </form>
            </section>

            <section
                    id="task-list-section"
                    class="task-list-section"
                    th:fragment="taskListSection"
                    th:attr="data-sort-direction=${sortDirection}">
                <div class="section-label">
                    <div class="section-title">
                        <span>Recent tasks</span>

                        <button
                                type="button"
                                class="sort-toggle"
                                th:attr="hx-get=@{/tasks/fragments/list(sortDirection=${nextSortDirection})}, aria-label=|Sort tasks ${nextSortDirection}|, title=|Sort ${nextSortDirection}|"
                                hx-target="#task-list-section"
                                hx-swap="outerHTML">
                            <span class="sort-icon" aria-hidden="true"></span>
                            <small th:text="${sortDirection}">desc</small>
                        </button>
                    </div>

                    <strong th:text="|${tasks.totalElements} total|">0 total</strong>
                </div>

                <div id="task-list" class="task-list">
                    <div
                            class="liyz-card task-empty-state"
                            th:if="${tasks.content.isEmpty()}">
                        <h2>No tasks yet</h2>
                        <p>Create your first task to get started.</p>
                    </div>

                    <th:block th:each="task : ${tasks.content}">
                        <div th:replace="~{fragments/task-item :: taskItem(task=${task})}"></div>
                    </th:block>
                </div>
            </section>
        </section>

        <aside class="assistant-panel">
            <header class="assistant-header">
                <div class="assistant-title">
                    <div class="robot-icon" aria-hidden="true">
                        <span></span>
                    </div>

                    <div>
                        <h2>Liyz</h2>
                        <p>Task assistant</p>
                    </div>
                </div>

                <span class="assistant-status" aria-label="Online"></span>
            </header>

            <div id="liyz-chat-messages" class="assistant-messages">
            </div>

            <form id="liyz-chat-form" class="assistant-input">
                <input
                        id="liyz-chat-input"
                        type="text"
                        class="form-control"
                        placeholder="Ask Liyz to manage your tasks..."
                        autocomplete="off">

                <button type="submit" aria-label="Send message">
                    &gt;
                </button>
            </form>
        </aside>
    </main>
</div>

</body>
</html>
