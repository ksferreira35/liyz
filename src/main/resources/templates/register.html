<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Liyz</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="liyz-body">

<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand-lockup text-center">
            <img
                    class="brand-logo brand-logo-lg"
                    th:src="@{/img/logo.svg}"
                    alt="Liyz logo">
            <h1>Create account</h1>
            <p>Start organizing your tasks with Liyz</p>
        </div>

        <form
                class="liyz-card auth-card"
                th:action="@{/register}"
                th:object="${registerRequest}"
                method="post">
            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

            <div class="liyz-field">
                <label for="username">Username</label>

                <input
                        id="username"
                        type="text"
                        class="form-control liyz-input"
                        placeholder="Enter username"
                        th:field="*{username}">

                <div
                        class="liyz-field-error"
                        th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}">
                </div>
            </div>

            <div class="liyz-field">
                <label for="email">Email</label>

                <input
                        id="email"
                        type="email"
                        class="form-control liyz-input"
                        placeholder="name@company.com"
                        th:field="*{email}">

                <div
                        class="liyz-field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                </div>
            </div>

            <div class="liyz-field">
                <label for="password">Password</label>

                <input
                        id="password"
                        type="password"
                        class="form-control liyz-input"
                        placeholder="Create a password"
                        th:field="*{password}">

                <div
                        class="liyz-field-error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                </div>
            </div>

            <button type="submit" class="liyz-button liyz-button-primary w-100">
                Create account
            </button>

            <p class="auth-switch">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>
        </form>

        <footer class="app-footer auth-footer">
            <div>
                <strong>Liyz</strong>
                <span>AI task management for focused work.</span>
            </div>

            <small>Built by Kaiky Ferreira. © 2026 Liyz. All rights reserved.</small>
        </footer>
    </section>
</main>

</body>
</html>
